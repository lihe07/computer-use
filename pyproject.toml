[project]
name = "computer-use"
version = "0.1.0"
description = "Computer-use MCP server for COSMIC/Wayland via xdg-desktop-portal RemoteDesktop + libei"
requires-python = ">=3.12"
dependencies = ["mcp>=1.10", "pillow>=10"]

[project.scripts]
computer-use = "cu.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cu"]
